name: Linux

# This workflow is triggered on pushes to the [master] branch.
on:
  push:
    branches:
      - test-all

env:
  AG_CI_URL: GeorgeAth
  AG_CI_PROJECT: AG-DEV
  AG_CI_BRANCH: master
  AG_CI_SCRIPT: scripts/ag.sh
  AG_CI_ARGS: --ci

jobs:
  cmake-build-linux:
    name: cmake-build-linux
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout the target project."
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AG_CI_URL }}/${{ env.AG_CI_PROJECT }}
          ref: refs/heads/${{ env.AG_CI_BRANCH }}
          path: ${{ env.AG_CI_PROJECT }}
          token: ${{ secrets.agci }}
          persist-credentials: false

      - name: "Install required dependencies."
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libasound2-dev \
            mesa-common-dev

      - name: "Run CI."
        run: |
          ${{ env.AG_CI_PROJECT }}/${{ env.AG_CI_SCRIPT }} ${{ env.AG_CI_ARGS }}
        shell: bash

      - name: "Upload Artifacts."
        uses: actions/upload-artifact@v4
        with:
          name: ag_artifacts_linux
          path: .build/out/bin
